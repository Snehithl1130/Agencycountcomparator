<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Agent Comparator</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Agency Agent Count Comparator</h1>

    <div class="topbar">
      <input type="text" id="search" placeholder="Search Agency..." />
      <button onclick="downloadCSV()">Download CSV</button>
      <button onclick="toggleTheme()">Toggle Theme</button>
    </div>

    <div class="panels">

      <div class="panel">
        <h3>Day 1 JSON</h3>
        <textarea id="day1"></textarea>
      </div>

      <div class="compare-center">
        <button class="compare-btn" onclick="compareJSON()">Compare Now</button>
      </div>

      <div class="panel">
        <h3>Day 2 JSON</h3>
        <textarea id="day2"></textarea>
      </div>

    </div>

    <div class="table-card">
      <h2>Difference Table</h2>
      <table>
        <thead>
          <tr>
            <th>Agency</th>
            <th>Day 1</th>
            <th>Day 2</th>
            <th>Difference</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>

    <div class="chart-card">
      <h2>Top Changes Chart</h2>
      <canvas id="chart"></canvas>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
